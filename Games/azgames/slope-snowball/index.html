<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slope SnowBall</title>
  <link rel="shortcut icon" href="image/favicon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
<script data-adstub src="stub-hook.js"></script>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div style="position: absolute; bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">
      2411111</div>
    <div id="unity-loading-bar">
      <img src="image/loading.png?v=1" id="bg" style="width: 100%; height: 100%;object-fit: cover;">
      <canvas id="logo-canvas" style="position: absolute; background-color: transparent;">
        <img src="image/barbg.png" id="barbg">
        <img src="image/bar1.png" id="bar1">
        <img src="image/bar2.png" id="bar2">
        <img src="image/bar3.png" id="bar3">
        <img src="image/ball.png" id="ball">
        <img src="image/loading_text.png" id="loading_text">
      </canvas>
    </div>
  </div>
  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");



    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/2411111.loader.js";
    const config = {
      dataUrl: buildUrl + "/2411111.data.unityweb",
      frameworkUrl: buildUrl + "/2411111.framework.js.unityweb",
      codeUrl: buildUrl + "/2411111.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "azgames.io",
      productName: "Slope SnowBall",
      productVersion: "2411111",
    };


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        logo_loading_percent = progress;
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
          window.focus();
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    };
    var logo_loaded = false;
    var logo_loading_percent = 0;

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    }
    window.onload = () => {
      drawCanvas(logo_loading_percent);
    }

    var logo_canvas = document.getElementById("logo-canvas");
    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var barbg = document.getElementById("barbg");
      var bar1 = document.getElementById("bar1");
      var bar2 = document.getElementById("bar2");
      var bar3 = document.getElementById("bar3");
      var ball = document.getElementById("ball");
      var loading_text = document.getElementById("loading_text");
      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }
      ctx.drawImage(barbg, 435 * _sw, 960 * _sh, 1050 * _sw, 57 * _sh);
      ctx.drawImage(loading_text, 861 * _sw, 900 * _sh, 198 * _sw, 46 * _sh);
      if (662 * _percent > 36) {
        ctx.drawImage(bar3, 475 * _sw, 960 * _sh, 970 * _sw * _percent, 57 * _sh);
      }
      ctx.drawImage(bar1, 436 * _sw, 960 * _sh, 40 * _sw, 57 * _sh);

      let _bar2x = 1008 * _percent;
      if (_bar2x > 300) {
        ctx.drawImage(bar2, (436 + _bar2x) * _sw, 960 * _sh, 40 * _sw, 57 * _sh);
        ctx.drawImage(ball, (395 + _bar2x) * _sw, 945 * _sh, 84 * _sw, 84 * _sh);
      }
      else if (_bar2x > 65) {
        ctx.drawImage(bar2, (450 + _bar2x) * _sw, 960 * _sh, 40 * _sw, 57 * _sh);
        ctx.drawImage(ball, (410 + _bar2x) * _sw, 945 * _sh, 84 * _sw, 84 * _sh);
      }
      else {
        ctx.drawImage(bar2, (430 + 40) * _sw, 960 * _sh, 40 * _sw, 57 * _sh);
        ctx.drawImage(ball, (390 + 40) * _sw, 945 * _sh, 84 * _sw, 84 * _sh);
      }
    }

    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
    }
    document.body.appendChild(script);
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics-compat.js"></script>



  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyD1JPAzV9h8OmurTwGdDwuvjefaDcvY_RU",
      authDomain: "slope-snowball.firebaseapp.com",
      projectId: "slope-snowball",
      storageBucket: "slope-snowball.firebasestorage.app",
      messagingSenderId: "1012408014847",
      appId: "1:1012408014847:web:215ced831cb1e5269ff9ca",
      measurementId: "G-9HTVRBML1Z"
    };
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); }

    window.gtag("config", firebaseConfig.measurementId, {
      cookie_domain: window.location.hostname,
      cookie_flags: "SameSite=None;Secure",
    });
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = getAuth(app);
  </script>

</body>

</html>
