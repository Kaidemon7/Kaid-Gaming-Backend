  <script>

    var GAME;
    let audioStatus = true;

    document.querySelector(".audio-button").addEventListener('click', function () {
      let status = this.classList.contains("mute");
      if (status) {
        this.classList.remove("mute");
        this.classList.add("unmute");
        audioStatus = true;
      } else {
        this.classList.remove("unmute");
        this.classList.add("mute");
        audioStatus = false;
      }
      if (typeof (GAME) == "object") {

        if (audioStatus) {
          GAME.playBgAudio();
        } else {
          GAME.stopBgAudio();
        }
      }
    })


  </script>
