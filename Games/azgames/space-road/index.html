      <canvas id="logo-canvas" style="position: absolute; background-color: black;">
        <img src="loading.png?v=1" id="ld_bg">
      </canvas>
    </div>
  </div>
  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");



    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/241005.loader.js";
    const config = {
      dataUrl: buildUrl + "/39679d14e6a65f6cef23a1436ccba6fe.data.unityweb",
      frameworkUrl: buildUrl + "/c325860cd3624e0c999798a2bca23fa5.js.unityweb",
      codeUrl: buildUrl + "/14b6541dcd961caba5356889a6e47679.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "horizon",
      productVersion: "1.0",
    };


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        logo_loading_percent = progress;
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    };

    // setTimeout(() => {
    //     var progress = 0.5;
    //     logo_loading_percent = progress;
    //     drawCanvas(progress);
    //   }, 1000);

    // var progress = 0;
    // setInterval(() => {
    //   logo_loading_percent = progress;
    //   drawCanvas(progress);
    //   progress += 0.01;
    // }, 30);


    var logo_loaded = false;
    var logo_loading_percent = 0;

    window.onresize = () => {
      // console.log('onresize');
      drawCanvas(logo_loading_percent);
    }
    window.onload = () => {
      // console.log('onload');
      drawCanvas(logo_loading_percent);
    }

    var logo_canvas = document.getElementById("logo-canvas");
    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var ld_bg = document.getElementById("ld_bg");
      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }

      // console.log(`${logo_canvas.width} ${logo_canvas.height}`);
      // background
      ctx.drawImage(ld_bg, 633 * _sw, 185 * _sh, 654 * _sw, 709 * _sh);

      //border
      ctx.strokeStyle = '#ffffff';
      ctx.rect(656 * _sw, 900 * _sh, 608 * _sw, 30 * _sh);
      ctx.lineWidth = 2;
      ctx.stroke();

      //fill
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(660 * _sw, 904 * _sh, 600 * _sw * _percent, 22 * _sh);
     

      //text
      //PERCENT
      var _fontSize = 36 * _sw;
      ctx.font = _fontSize.toString() + "px BRLNSDB";
      ctx.fillStyle = "#ffffff";
      ctx.textAligh = "center";
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#000000';
      let _txt = (Math.floor(_percent * 100)).toString() + '%';
      let _tx = logo_canvas.width * 0.5 - ctx.measureText(_txt).width * 0.5 * _sw - 20 * _sw;
      let _ty = logo_canvas.height * 0.5 + 430 * _sh;
      ctx.strokeText(_txt, _tx, _ty);
      ctx.fillText(_txt, _tx, _ty);
    }
    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      // console.log(`${_w} ${_h} ${_nw}`);
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }

    }


    document.body.appendChild(script);
  </script>
