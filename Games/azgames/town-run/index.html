<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Town Run</title>
  <link rel="shortcut icon" href="favicon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
<script data-adstub src="stub-hook.js"></script>
<script data-adstub2 src="stub-rm.js"></script>
</head>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <canvas id="logo-canvas" style="position: absolute; background-color: transparent;">
        <img src="loading.png?v=1" id="ld_bg">
        <img src="loading_bg.png" id="ld_bar">
        <img src="loading_mask.png" id="ld_mask">
        <img src="loading_bg_mask.png" id="ld_bar_mask">
      </canvas>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");



    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/240926.loader.js";
    const config = {
      dataUrl: buildUrl + "/240926.data.unityweb",
      frameworkUrl: buildUrl + "/240926.framework.js.unityweb",
      codeUrl: buildUrl + "/240926.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GM Soft",
      productName: "Town Run",
      productVersion: "1.0",
    };


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    };
    var logo_loaded = false;
    var logo_loading_percent = 0;

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    }
    window.onload = () => {
      drawCanvas(logo_loading_percent);
    }

    var logo_canvas = document.getElementById("logo-canvas");
    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var ld_bg = document.getElementById("ld_bg");
      var ld_bar = document.getElementById("ld_bar");
      var ld_mask = document.getElementById("ld_mask");
      var ld_bar_mask = document.getElementById("ld_bar_mask");
      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }
      _percent = 0.5;
      //Mask
      var maskbar_W = 1037;

      var _fl1 = ((1920 - maskbar_W) / 2) + _percent * maskbar_W;

      var _fw = maskbar_W - _percent * maskbar_W;
      ctx.drawImage(ld_bg, 0, 0, logo_canvas.width, logo_canvas.height);
      ctx.drawImage(ld_bar, 413 * _sw, logo_canvas.height - (189 * _sh), 1094 * _sw, 126 * _sh);
      ctx.drawImage(ld_mask, _fl1 * _sw, logo_canvas.height - (160 * _sh), _fw * _sw, 66 * _sh);
      ctx.drawImage(ld_bar_mask, 441.5 * _sw, logo_canvas.height - (160 * _sh), 1037 * _sw, 66 * _sh);
    }
    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
    }
    document.body.appendChild(script);
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics-compat.js"></script>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyD6aUtH3EPGBicKmR0_PX6OPzDTzu5cmt8",
      authDomain: "town-run-fbf64.firebaseapp.com",
      projectId: "town-run-fbf64",
      storageBucket: "town-run-fbf64.appspot.com",
      messagingSenderId: "569004067657",
      appId: "1:569004067657:web:fd4eba7583f1fc65f02898",
      measurementId: "G-DEFMDE8KVF"
    };

    // Initialize Firebase
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); }

    window.gtag("config", firebaseConfig.measurementId, {
      cookie_domain: location.hostname,
      cookie_flags: "SameSite=None;Secure",
    });
    const app = firebase.initializeApp(firebaseConfig);
    const auth = getAuth(app);
  </script>
</body>

</html>
