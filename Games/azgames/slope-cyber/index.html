  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <img src="loading.png?v=1" id="bg" style="width: 100%; height: 100%;object-fit: cover;">
      <canvas id="logo-canvas" style="position: absolute; background-color: transparent;">
        <img src="logo.png?v=1" id="ld_logo">
                
      </canvas>
      <canvas id = "circle_canvas" style="position: absolute; background-color: transparent;">
        <img src="loading_circle.png" id="ld_circle">
      </canvas>
    </div>
  </div>
  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");



    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/240927.loader.js";
    const config = {
      dataUrl: buildUrl + "/cbbc1b478250eb9fdc7401f6622c4679.data.unityweb",
      frameworkUrl: buildUrl + "/328a09838d720cfe244ca2bd6d852b9c.js.unityweb",
      codeUrl: buildUrl + "/7bc533dda613a74f49d70279109cc187.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GM",
      productName: "Slope Cyber",
      productVersion: "0.1",
    };
    

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }
    
    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        logo_loading_percent = progress;
      }).then((unityInstance) => {
		window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    };

    var logo_loaded = false;
    var logo_loading_percent = 0;
    var circle_angle = 0;

    window.onresize = () => {
      drawCircle();
    }
    window.onload = () => {
      drawCircle();
    }

    setInterval(() => {
      drawCircle();
    }, 30);

    var logo_canvas = document.getElementById("logo-canvas");
    var circle_canvas = document.getElementById("circle_canvas");

    function drawCircle() {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var ld_bg = document.getElementById("ld_bg");
      var ld_circle = document.getElementById("ld_circle");
      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;
      if (logo_loading_percent > 1) {
        logo_loading_percent = 1;
      }
      //BACKGROUND
      ctx.drawImage(ld_logo, 518 * _sw, 100 * _sh, 884 * _sw, 884 * _sh);
      //PERCENT
      var _fontSize = 87 * _sw;
      ctx.font = _fontSize.toString() + "px SuperBrigadeItalic";
      ctx.fillStyle = "White";
      ctx.textAligh = "center";
      let _txt = (Math.floor(logo_loading_percent * 100)).toString() + " %";
      ctx.fillText(_txt, logo_canvas.width * 0.5 - ctx.measureText(_txt).width * 0.5, logo_canvas.height * 0.5 + 330 * _sh);

      if (logo_loading_percent < 1) {
        //CIRCLE
        var circle_ctx = circle_canvas.getContext("2d");
        // move to the center of the canvas
        circle_ctx.translate(circle_canvas.width / 2, circle_canvas.height / 2);
        // rotate the canvas to the specified degrees
        circle_ctx.rotate(circle_angle * Math.PI / 180);
        circle_angle += 10;
        let _cw = 884 * _sw;
        let _ch = 884 * _sh;
        circle_ctx.drawImage(ld_circle, -_cw * 0.5, -_ch * 0.5, _cw, _ch);
      }
    }

    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      // console.log(`${_w} ${_h} ${_nw}`);
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
      circle_canvas.width = logo_canvas.width;
      circle_canvas.height = logo_canvas.height;
    }
   
    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      // console.log(`${_w} ${_h} ${_nw}`);
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
      circle_canvas.width = logo_canvas.width;
      circle_canvas.height = logo_canvas.height;

    }


    document.body.appendChild(script);
  </script>
