<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shooter Hero</title>
  <link rel="shortcut icon" href="image/favicon.png">
  <link rel="stylesheet" href="TemplateData/style.css">
<script data-adstub src="stub-hook.js"></script>
<script data-adstub2 src="stub-rm.js"></script>
</head>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div style="position: absolute; bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">2411131</div>
    <div id="unity-loading-bar">
      <img src="image/loading.png?v=1" id="bg" style="width: 100%; height: 100%;object-fit: cover;">
      <canvas id="logo-canvas" style="position: absolute; background-color: transparent;">
        <img src="image/loading_bg.png" id="ld_bar">
        <img src="image/loading_fill.png" id="ld_fill">
        <img src="image/loading_mask.png" id="ld_mask">
        <img src="image/loading_bg_mask.png" id="ld_bar_mask">
        <img src="image/logo.png" id="ld_logo">
      </canvas>
    </div>
  </div>

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/2411131.loader.js";
    const config = {
      dataUrl: buildUrl + "/2411131.data.unityweb",
      frameworkUrl: buildUrl + "/2411131.framework.js.unityweb",
      codeUrl: buildUrl + "/2411131.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "azgames.io",
      productName: "Shooter Hero",
      productVersion: "2411131",
    };


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
          window.focus();
        }, 2000);
      }).catch((message) => {
        alert(message);
      });
    };
    var logo_loaded = false;
    var logo_loading_percent = 0;

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    }
    window.onload = () => {
      drawCanvas(logo_loading_percent);
    }

    var logo_canvas = document.getElementById("logo-canvas");
    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var ld_bar = document.getElementById("ld_bar");
      var ld_fill = document.getElementById("ld_fill");
      var ld_mask = document.getElementById("ld_mask");
      var ld_bar_mask = document.getElementById("ld_bar_mask");
      var ld_logo = document.getElementById("ld_logo");
      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }
      //Mask
      var maskbar_W = 666;
      var _fl1 = ((1920 - maskbar_W) / 2) + _percent * maskbar_W;
      var _fw = maskbar_W - _percent * maskbar_W;
      ctx.drawImage(ld_bar, 619.5 * _sw, logo_canvas.height - (130 * _sh), 681 * _sw, 44 * _sh);
      ctx.drawImage(ld_fill, 625 * _sw, logo_canvas.height - (125 * _sh), 670 * _sw, 34 * _sh);
      ctx.drawImage(ld_mask, _fl1 * _sw, logo_canvas.height - (125 * _sh), _fw * _sw, 34 * _sh);
      ctx.drawImage(ld_bar_mask, 619.5 * _sw, logo_canvas.height - (130 * _sh), 681 * _sw, 44 * _sh);
      ctx.drawImage(ld_logo, 601 * _sw, logo_canvas.height - (1000 * _sh), 718 * _sw, 499 * _sh);
    }
    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = _h * 16 / 9;
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      }
      else {
        logo_canvas.width = _w;
        logo_canvas.height = _w * 9 / 16;
      }
    }


    document.body.appendChild(script);
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics-compat.js"></script>



  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAFGIrqz1pBxKXczoiIKUDMNmQD558HeAk",
  authDomain: "shooter-hero-b6567.firebaseapp.com",
  projectId: "shooter-hero-b6567",
  storageBucket: "shooter-hero-b6567.firebasestorage.app",
  messagingSenderId: "640023779437",
  appId: "1:640023779437:web:d52559c8e4cce525864764",
  measurementId: "G-FZJG3E8FM0"
};

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); }

    window.gtag("config", firebaseConfig.measurementId, {
      cookie_domain: window.location.hostname,
      cookie_flags: "SameSite=None;Secure",
    });
    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = getAuth(app);
  </script>
</body>

</html>
