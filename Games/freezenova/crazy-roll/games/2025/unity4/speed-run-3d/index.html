	function InitApi(_appId) 
    {
		var dateNow = new Date();
		var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);
		
		console.log('InitApi');
		
		window.callTime = secondsSinceEpoch - 181;
    }
	
	function InitExternEval(_appId) 
    {
		console.log("InitExternEval");
		
		ExternEval();
    }
    
    function ExternEval() 
    {
		console.log("ExternEval");
		
		var dateNow = new Date();
		var secondsSinceEpoch = Math.round(dateNow.getTime() / 1000);
		
		if (window.callTime != undefined && 
			secondsSinceEpoch - window.callTime > 180)
		{
			console.log('ExternEval 2');
			
			window.callTime = secondsSinceEpoch;
			
			if (typeof preroll !== 'undefined')
			{
				if (window[preroll.config.loaderObjectName] != undefined)
				{
					gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');
				
					try {
						window[preroll.config.loaderObjectName].refetchAd(ExternEvalResumeGame);
					}
					catch(err) {
						console.log(err.message);
						gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
					}
				}
			}
		}
		
    }
	
	function ExternEvalResumeGame()
	{
		console.log("ExternEvalResumeGame");
	
		gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
	}
	
	function PreloadRewarded() 
	{
		console.log("PreloadRewarded");
	
		if (window.rewardedCallbacks == undefined)
		{
			window.rewardedCallbacks = true;
			
			try {
				window[window.preroll.config.loaderObjectName].registerRewardCallbacks({
					onReady:RewardedReady, 
					onSuccess:RewardedSuccess, 
					onFail:RewardedFail,
					onClose:RewardedClose
				});
			}
			catch(err) {
				console.log(err.message);
			}
		}
	}
		
	function ShowRewarded() 
	{
		console.log("ShowRewarded");
	
		if (typeof preroll !== 'undefined')
		{
			if (window.rewardedCallbacks == undefined)
			{
				PreloadRewarded();
			}
		
			if (window[preroll.config.loaderObjectName] != undefined)
			{
				gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onOpen');
			
				try {
					window[preroll.config.loaderObjectName].showRewardAd();
				}
				catch(err) {
					console.log(err.message);
					gameInstance.SendMessage('FreezeNovaAPI', 'AdMessage', 'onClose');
				}
			}
		}
	
	}
	
	function RewardedReady()
	{
		console.log("RewardedReady");
		
		if (window.rewardedCount == undefined)
		{
			window.rewardedCount = 1;
			window.gameInstance.SendMessage('FreezeNovaAPI', 'RewardedReady');

  <script>
    // ---------- Device detection ----------
    const desktopWrap = document.getElementById('desktop-wrap');

   {
      // ===== DESKTOP: run Unity directly on this page (no iframe) =====
      desktopWrap.style.display = 'block';

      // Pull UB from this page (no parent iframe)
      var UB = window.UNITY_BUILD;
      if (!UB) { alert("UNITY_BUILD not found"); }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var textProgress = document.querySelector("#unity-text-progress");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      if (UB && UB.productName) document.title = UB.productName;

      // Desktop sizing (full window)
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      window.addEventListener('resize', function(){
        // minor debounce so Unity doesn't thrash
        setTimeout(function(){
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
        }, 250);
      }, false);

      // Build config from UB (only include optional fields if present to avoid #if macros)
      var config = {
        dataUrl: UB.dataUrl,
        frameworkUrl: UB.frameworkUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: UB.companyName,
        productName: UB.productName,
        productVersion: UB.productVersion,
        showBanner: unityShowBanner
      };
      if (UB.codeUrl)    config.codeUrl = UB.codeUrl;
      if (UB.memoryUrl)  config.memoryUrl = UB.memoryUrl;
      if (UB.symbolsUrl) config.symbolsUrl = UB.symbolsUrl;

      loadingBar.style.display = "block";
      var showLoadingBar = false;
      if (!showLoadingBar) progressBarEmpty.style.display = "none";

      const rootPath = 'TemplateData';
      var script = document.createElement("script");
      script.src = UB.loaderUrl;              // unhashed loader provided by UNITY_BUILD
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          if (progress >= 0.9 && progress < 1) {
            textProgress.innerHTML =
              'Opening ' + UB.productName + '…<br>' +
              '<img src="' + rootPath + '/gears.gif" class="spinner" width="90" height="90" />';
            progressBarEmpty.style.display = "none";
          } else {
            textProgress.innerHTML =
              'Loading ' + UB.productName + ' - ' + Math.floor(progress * 100) + '%<br>' +
              '<img src="' + rootPath + '/gears.gif" class="spinner" width="90" height="90" />';
          }
          if (showLoadingBar) {
            progressBarFull.style.width = (progress * 100) + "%";
          }
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
            // call is harmless on desktop (helper early-returns)
              if (window.__hookMobileAudio) { window.__hookMobileAudio(unityInstance); }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    }
  </script>
   <!-- Mobile-only keep-awake (inline, no external file) -->
<script>
(function(){
  var isMobile = /Android|iPhone|iPad|iPod|IEMobile|Windows Phone|BlackBerry|Opera Mini/i.test(navigator.userAgent);
  if (!isMobile) return;

  (function(global){
    var sentinel = null;
    var active = false;

    async function requestWakeLock(){
      if ('wakeLock' in navigator && navigator.wakeLock && typeof navigator.wakeLock.request === 'function'){
        try{
          sentinel = await navigator.wakeLock.request('screen');
          active = true;
          if (sentinel && typeof sentinel.addEventListener === 'function'){
            sentinel.addEventListener('release', function(){
              if (document.visibilityState === 'visible'){
                requestWakeLock().catch(function(){});
              }
            });
          }
          return true;
        }catch(e){}
      }
      return false;
    }

    function onGesture(){
      document.removeEventListener('pointerdown', onGesture, true);
      document.removeEventListener('touchend', onGesture, true);
      requestWakeLock().catch(function(){});
    }

    document.addEventListener('pointerdown', onGesture, true);
    document.addEventListener('touchend', onGesture, true);

    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible' && active && sentinel == null){
        requestWakeLock().catch(function(){});
      }
    }, false);
  })(window);
})();
</script>
