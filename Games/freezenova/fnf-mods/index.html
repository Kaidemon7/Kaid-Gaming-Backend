<style>
:root {
  --bg: #0f1115;
  --card: #1b1f2a;
  --accent: #4fc3f7;
  --text: #eaeaea;
  --muted: #9aa0a6;
}

* { box-sizing: border-box; }

/* lock iframe scrolling */
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: linear-gradient(180deg, #0c0f14, #111);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* header */
header {
  padding: 30px 20px;
  text-align: center;
  flex-shrink: 0;
}

header h1 {
  margin: 0 0 12px;
  font-size: 2.4rem;
}

.search {
  max-width: 420px;
  margin: 0 auto;
}

.search input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: none;
  outline: none;
  background: #1b1f2a;
  color: var(--text);
  font-size: 1rem;
}

.search input::placeholder {
  color: var(--muted);
}

/* FULL-WIDTH scroll container */
main {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* centered content */
.content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}

.mod {
  background: linear-gradient(160deg, #1b1f2a, #141824);
  border-radius: 16px;
  padding: 18px;
  text-decoration: none;
  color: var(--text);
  position: relative;
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}

.mod::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(
    400px circle at var(--x, 50%) var(--y, 50%),
    rgba(79,195,247,0.18),
    transparent 40%
  );
  opacity: 0;
  transition: opacity .2s;
}

.mod:hover::after { opacity: 1; }

.mod:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 35px rgba(0,0,0,.45);
}

.mod span {
  font-size: 1.05rem;
  font-weight: 600;
}

/* footer */
footer {
  text-align: center;
  padding: 20px 10px;
  color: var(--muted);
  font-size: 0.9rem;
  flex-shrink: 0;
}

/* optional scrollbar styling */
main::-webkit-scrollbar {
  width: 10px;
}
main::-webkit-scrollbar-thumb {
  background: #2a2f3d;
  border-radius: 10px;
}
main::-webkit-scrollbar-thumb:hover {
  background: #3a4155;
}
</style>

<script>
function filterMods(value) {
  value = value.toLowerCase();
  document.querySelectorAll(".mod").forEach(mod => {
    mod.style.display = mod.textContent.toLowerCase().includes(value)
      ? "block"
      : "none";
  });
}

document.querySelectorAll(".mod").forEach(card => {
  card.addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty("--x", e.clientX - r.left + "px");
    card.style.setProperty("--y", e.clientY - r.top + "px");
  });
});
</script>
